[workspace]
members = [
  "crates/protocol",
  "crates/model-gateway",
  "crates/model-gateway-chat-completions",
  "crates/capability-broker",
  "crates/worker-runtime",
  "crates/orchestration-kernel",
  "crates/orchestration-api",
  "apps/demo",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
